name: nutrican
region: nyc

static_sites:
  - name: frontend
    source_dir: /
    github:
      repo: balirwaalvin/NutriCan-Mobile
      branch: main
      deploy_on_push: true
    build_command: npm install && npm run build
    output_dir: dist
    index_document: index.html
    error_document: index.html
    envs:
      - key: VITE_APPWRITE_ENDPOINT
        value: "https://fra.cloud.appwrite.io/v1"
        scope: BUILD_TIME
      - key: VITE_APPWRITE_PROJECT_ID
        value: "69be824c0009f8aaccd5"
        scope: BUILD_TIME
      - key: VITE_APPWRITE_DATABASE_ID
        value: "nutrican_db"
        scope: BUILD_TIME
      - key: VITE_APPWRITE_PROFILES_COLLECTION
        value: "profiles"
        scope: BUILD_TIME
      - key: VITE_APPWRITE_JOURNAL_COLLECTION
        value: "journal"
        scope: BUILD_TIME
      - key: VITE_APPWRITE_MEALS_COLLECTION
        value: "meals"
        scope: BUILD_TIME
      - key: VITE_APPWRITE_CHAT_COLLECTION
        value: "chat"
        scope: BUILD_TIME
      - key: VITE_APPWRITE_DOCS_BUCKET
        value: "medical_docs"
        scope: BUILD_TIME
      - key: VITE_APPWRITE_BOOKS_BUCKET
        value: "books"
        scope: BUILD_TIME
      - key: VITE_GROQ_API_KEY
        scope: BUILD_TIME
        type: SECRET
